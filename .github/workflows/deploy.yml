name: Deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: ghcr.io/${{ vars.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.JENNFYI_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Heztner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.CATTY_JENNFYI }}
          script: |
            set -e
            APP_DIR="/home/deploy/code/jenn.fyi"
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            touch .env
            cat > compose.yaml <<'YAML'
            services:
              web:
                image: ${IMAGE}
                restart: unless-stopped
                ports:
                  - "4242:3000"
                env_file:
                  - .env
                environment:
                  NODE_ENV: production
                  PORT: 3000
                  HOST: 0.0.0.0
            YAML

            cat > .env <<EOF
            IMAGE=$IMAGE
            EOF

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u "${{ vars.GHCR_USERNAME }}" \
              --password-stdin

            docker compose pull web
            docker compose up -d --remove-orphans
            docker image prune -f
