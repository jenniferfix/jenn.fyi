name: Deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: ghcr.io/${{ vars.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.JENNFYI_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.CATTY_JENNFYI }}
          script: |
            mkdir -p /home/deploy/code/jenn.fyi

      - name: Copy deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.CATTY_JENNFYI }}
          source: "compose.yaml,Caddyfile"
          target: "/home/deploy/code/jenn.fyi"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.CATTY_JENNFYI }}
          script: |
            set -e

            APP_DIR="/home/deploy/code/jenn.fyi"
            cd "$APP_DIR"

            cat > .env <<'EOF'
            IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            CDN_ORIGIN=${{ vars.CDN_ORIGIN }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_API_HOST=${{ vars.VITE_POSTHOG_API_HOST }}
            VITE_POSTHOG_UI_HOST=${{ vars.VITE_POSTHOG_UI_HOST }}
            EOF

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u "${{ vars.GHCR_USERNAME }}" \
              --password-stdin

            docker compose pull web
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
