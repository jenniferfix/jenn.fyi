services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      default:
      jennfyi_net:
        aliases:
          - jennfyi-web

networks:
  jennfyi_net:

volumes:
  caddy_data:
  caddy_config:
