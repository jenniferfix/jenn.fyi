services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_FILTER: "@jenn.fyi/web"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # DATABASE_URL: ${DATABASE_URL}
      # SESSION_SECRET: ${SESSION_SECRET}
    env_file:
      - .env.production
    networks:
      - app_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_net

networks:
  app_net:

volumes:
  caddy_data:
  caddy_config:
